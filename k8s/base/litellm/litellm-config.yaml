# Shared LiteLLM config — serves all tenants via a single model catalog.
# Per-tenant isolation is handled by virtual keys (provisioned by Agent Warden Server).
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-proxy-config
  namespace: agent-warden-system
  labels:
    app.kubernetes.io/name: litellm-proxy
    app.kubernetes.io/part-of: agent-warden
data:
  config.yaml: |
    model_list:
      - model_name: kimi-k2.5
        litellm_params:
          model: azure_ai/Kimi-K2-5
          api_base: https://ai-awarden-dev.services.ai.azure.com/models
          api_key: os.environ/AZURE_AI_API_KEY

    litellm_settings:
      drop_params: true
      telemetry: false
      callbacks: ["custom_callback.data_llm_callback"]

    general_settings:
      allow_user_auth: true
