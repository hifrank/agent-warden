# RBAC — LiteLLM proxy service account needs pod:list to resolve
# requester pod IPs to tenant namespaces for telemetry attribution.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: litellm-proxy-pods-reader
  labels:
    app.kubernetes.io/name: litellm-proxy
    app.kubernetes.io/part-of: agent-warden
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: litellm-proxy-pods-reader
  labels:
    app.kubernetes.io/name: litellm-proxy
    app.kubernetes.io/part-of: agent-warden
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: litellm-proxy-pods-reader
subjects:
  - kind: ServiceAccount
    name: litellm-proxy
    namespace: agent-warden-system
