# OAuth2 Proxy — Entra ID OIDC authentication for OpenClaw Web UI
# Deployed per-tenant in the tenant namespace.
# Users must sign in via Microsoft Entra ID before accessing the chat UI.
# Webhook routes bypass oauth2-proxy (authenticated by channel tokens).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: tenant-df-demo
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/instance: df-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
      app.kubernetes.io/instance: df-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy
        app.kubernetes.io/instance: df-demo
    spec:
      nodeSelector:
        openclaw.io/pool: tenant
      tolerations:
        - key: "openclaw.io/tenant-only"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://login.microsoftonline.com/dab94ed2-4cee-4b36-b007-6618f570b4a3/v2.0
            - --client-id=$(CLIENT_ID)
            - --client-secret=$(CLIENT_SECRET)
            - --cookie-secret=$(COOKIE_SECRET)
            - --cookie-secure=true
            - --cookie-name=_oc_session
            - --upstream=http://openclaw-df-demo.tenant-df-demo.svc.cluster.local:18789
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            - --skip-provider-button=true
            - --pass-access-token=true
            - --reverse-proxy=true
            - --skip-auth-route=^/webhook/.*
            - --skip-auth-route=^/ws/.*
          env:
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy
                  key: client-id
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy
                  key: client-secret
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: tenant-df-demo
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/instance: df-demo
spec:
  selector:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/instance: df-demo
  ports:
    - name: http
      port: 4180
      targetPort: 4180
      protocol: TCP
