{{- if .Values.litellmProxy.enabled }}
{{- /*
  In shared LiteLLM mode the init container needs the proxy master-key to
  seed openclaw.json.  The canonical source is the litellm-proxy-secret
  in agent-warden-system.  During provisioning, the key is copied into
  this per-tenant secret by provision-tenant.sh so it stays in sync and
  no plaintext key has to live in values.yaml.

  If the secret already exists (created by the provisioning script)
  Helm will adopt and manage it thanks to the labels.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: litellm-proxy-key
  namespace: tenant-{{ .Values.tenantId }}
  labels:
    {{- include "openclaw-tenant.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-5"
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Populated by provision-tenant.sh — Helm only creates the shell if absent.
  # The hook "pre-install" + resource-policy "keep" ensures Helm never
  # overwrites an existing secret on upgrade.
  {{- if .Values.litellmProxy.masterKey }}
  master-key: {{ .Values.litellmProxy.masterKey | b64enc | quote }}
  {{- else }}
  master-key: {{ "" | b64enc | quote }}
  {{- end }}
{{- end }}
