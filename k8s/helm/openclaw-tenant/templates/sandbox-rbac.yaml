{{- if .Values.sandbox.enabled }}
# RBAC for gateway to create/manage sandbox pods (§4.1.1)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openclaw-{{ .Values.tenantId }}-sandbox-manager
  namespace: tenant-{{ .Values.tenantId }}
  labels:
    {{- include "openclaw-tenant.labels" . | nindent 4 }}
    openclaw.io/component: sandbox
rules:
  # Create, read, delete sandbox pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Read pod logs (tool output + telemetry)
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Read sandbox pod template ConfigMap
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["sandbox-pod-template-{{ .Values.tenantId }}"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openclaw-{{ .Values.tenantId }}-sandbox-manager
  namespace: tenant-{{ .Values.tenantId }}
  labels:
    {{- include "openclaw-tenant.labels" . | nindent 4 }}
    openclaw.io/component: sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openclaw-{{ .Values.tenantId }}-sandbox-manager
subjects:
  - kind: ServiceAccount
    name: openclaw-{{ .Values.tenantId }}
    namespace: tenant-{{ .Values.tenantId }}
{{- end }}
