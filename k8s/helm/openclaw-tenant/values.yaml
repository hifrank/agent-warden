# -- Tenant configuration
tenantId: ""
tier: "free"  # free | pro | enterprise

# -- OpenClaw image
image:
  repository: acragentwardendev.azurecr.io/openclaw
  tag: "2026.3.12"
  pullPolicy: IfNotPresent

# -- Resource limits per tier
resources:
  free:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"
  pro:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  enterprise:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

# -- Persistent storage per tier (§4.5.5)
storage:
  free:
    stateSize: "2Gi"
    workspaceSize: "3Gi"
    storageClass: "managed-premium-lrs"
  pro:
    stateSize: "20Gi"
    workspaceSize: "30Gi"
    storageClass: "managed-premium-zrs"
  enterprise:
    stateSize: "100Gi"
    workspaceSize: "400Gi"
    storageClass: "managed-premium-zrs"

# -- Azure Key Vault for secrets injection
keyVault:
  name: ""
  tenantIdEntra: ""
  clientId: ""

# -- Cosmos DB governance container (for data.activity + data.llm → lineage aggregator)
cosmos:
  endpoint: ""              # e.g. https://cosmos-agentwarden-dev.documents.azure.com:443/
  database: "agent-warden"

# -- Azure OpenAI configuration
azureOpenAI:
  enabled: false
  endpoint: ""            # e.g. https://aoai-agentwarden-dev.openai.azure.com/
  deploymentName: "gpt-54"
  baseModel: "gpt-4o"     # underlying model for token limits & cost tracking
  apiVersion: "2024-10-21"

# -- Workload Identity
serviceAccount:
  annotations: {}

# -- Network policy
networkPolicy:
  enabled: true
  egressAllowCIDRs: []
  egressAllowDomains:
    - "api.openai.com"
    - "api.anthropic.com"
    - "api.telegram.org"
    - "discord.com"
    - "gateway.discord.gg"
    - "slack.com"
    - "*.openai.azure.com"

# -- Channels (Telegram, Discord, Slack, etc.)
channels:
  telegram:
    enabled: false   # Set true + store telegram-bot-token in Key Vault

# -- Gateway API (Application Gateway for Containers) §7
gateway:
  enabled: true
  name: "agent-warden-gateway"           # Name of the shared Gateway resource
  namespace: "agent-warden-system"       # Namespace where the Gateway lives
  hostname: "gw.example.com"         # Override per-environment
  token: ""                          # Override per-tenant; never commit real tokens

# -- Graceful shutdown
terminationGracePeriodSeconds: 30

# -- Git-sync sidecar for workspace memory versioning (§4.5.9)
gitSync:
  enabled: false
  repo: ""
  period: "300s"

# -- Memory index rebuild init container (§4.5.8)
memoryIndexRebuild:
  enabled: false

# -- Ephemeral volume size limit
ephemeralSizeLimit: "2Gi"

# -- LiteLLM Proxy configuration
# Two modes:
#   shared: true  → uses shared LiteLLM Deployment in agent-warden-system (no sidecar)
#   shared: false → per-tenant sidecar (legacy, higher resource usage)
litellmProxy:
  enabled: true
  shared: false                    # Set true to use shared LiteLLM service
  sharedEndpoint: "http://litellm-proxy.agent-warden-system.svc.cluster.local:4000/v1"
  port: 4000
  masterKey: ""                    # Ignored in shared mode; sourced from Key Vault secret 'litellm-master-key'
  grok4Fast: false                 # Enable grok-4-fast-non-reasoning model in OpenClaw catalog
  imageModel: ""                   # Image-capable model override (e.g. "gpt-5.4"); prefixed with litellm/ automatically; defaults to azureOpenAI.baseModel if empty
  logLevel: "WARNING"
  image:
    repository: litellm/litellm
    tag: "v1.82.0-stable"
    pullPolicy: IfNotPresent

# -- Purview DLP Plugin (OpenClaw plugin for DLP via Microsoft Purview Graph API)
# Purview is in E5 tenant "aprforazure" (dab94ed2-4cee-4b36-b007-6618f570b4a3)
purviewDlpPlugin:
  enabled: true
  mode: "enforce"           # "enforce" (block/redact) or "audit" (log only)
  layers:
    promptGuard: true       # L1: inject DLP policy into agent context
    outputScanner: true     # L2: scan tool output via Purview processContent
    inputAudit: true        # L3: audit inbound user messages via Purview
  purviewEnabled: true      # Enable Purview Graph API (requires Content.Process.All + M365 E5 license)
  purviewUserId: ""   # Per-agent E5-licensed Entra user — set via Instance Detail UI, passed during provisioning
  purviewTenantId: "dab94ed2-4cee-4b36-b007-6618f570b4a3"  # E5 tenant ID (aprforazure)
  image:
    repository: acragentwardendev.azurecr.io/purview-dlp-plugin
    tag: "0.2.4"
    pullPolicy: IfNotPresent

# -- Agents View Plugin (OpenClaw plugin for Azure Monitor Agents View)
# Emits OTel GenAI Semantic Convention spans for Azure Monitor's Agents View blade.
agentsViewPlugin:
  enabled: true
  otelEndpoint: "http://otel-collector.agent-warden-system.svc.cluster.local:4318/v1/traces"
  sampleRate: 1.0
  enableContentCapture: false   # PII-sensitive — captures prompt/completion content in spans
  serviceName: "openclaw-gateway"
  image:
    repository: acragentwardendev.azurecr.io/agents-view-plugin
    tag: "0.3.0"
    pullPolicy: IfNotPresent

# -- Agent 365 Observability Plugin (OpenClaw plugin for M365 security stack)
# Emits Agent 365 SDK spans (InvokeAgent, ExecuteTool, Inference) to
# M365 Admin Center, Microsoft Defender, and Purview DSPM.
# Requires Frontier Preview Program enrollment for production export.
a365Plugin:
  enabled: false
  agentId: "60e56f90-f29e-4b97-ac94-6b0500106f77"   # Blueprint app ID (no bot registration)
  agentName: "Agent Warden"
  agentBlueprintId: "60e56f90-f29e-4b97-ac94-6b0500106f77"
  agentUpn: "a365072dfe@aprforazure.onmicrosoft.com"
  agenticUserId: "a55f13fb-b27d-4421-832e-2f441bc6c9a0"  # Agentic user OID (from M365 Admin Center activation)
  aaInstanceId: "760d5a66-7a2d-4c58-b8f9-b89627429aeb"   # AA Instance ID — required for T1/T2/FIC token flow
  m365TenantId: "dab94ed2-4cee-4b36-b007-6618f570b4a3"   # M365 tenant ID — appears in A365 span baggage
  azureTenantId: "dab94ed2-4cee-4b36-b007-6618f570b4a3"  # Azure AD tenant ID for T1/T2/FIC token flow
  channelName: "telegram"
  enableA365Exporter: true    # Export to agent365.svc.cloud.microsoft
  serviceName: "openclaw-gateway"
  serviceNamespace: "agent-warden"
  image:
    repository: acragentwardendev.azurecr.io/a365-plugin
    tag: "0.1.4"
    pullPolicy: IfNotPresent

# -- Browser init container (installs Chrome for agent-browser)
# Copies Chrome files to /opt/agent-browser via an emptyDir volume.
# Keeps the upstream OpenClaw image clean — no custom image needed.
browserInit:
  enabled: false
  image:
    repository: acragentwardendev.azurecr.io/browser-init
    tag: "latest"
    pullPolicy: IfNotPresent
  config:
    executablePath: "/opt/agent-browser/bin/google-chrome"
    headless: true
    noSandbox: true

# -- Heartbeat sidecar (probes gateway health → OTel metrics → App Insights)
heartbeat:
  enabled: false
  intervalMs: 30000
  otelEndpoint: "http://otel-collector.agent-warden-system.svc.cluster.local:4318/v1/metrics"
  serviceName: "openclaw-heartbeat"
  image:
    repository: acragentwardendev.azurecr.io/heartbeat
    tag: "latest"
    pullPolicy: IfNotPresent

# -- OpenTelemetry diagnostics (§21 Monitoring)
# Exports traces, metrics, and logs from OpenClaw gateway to OTel Collector → App Insights.
diagnosticsOtel:
  enabled: true
  endpoint: "http://otel-collector.agent-warden-system.svc.cluster.local:4318"
  logs: false
  sampleRate: 1.0
  flushIntervalMs: 5000

# -- SaaS Auth Proxy sidecar (§18.7 Delegated Identity)
# Intercepts outbound SaaS API calls, injects OAuth tokens, enforces path policies.
# Pi Agent calls http://localhost:9090/{provider}/{api-path}
saasProxy:
  enabled: true
  port: 9090
  logLevel: "info"
  googleClientId: ""     # Entra App Registration or Google OAuth client ID
  graphClientId: ""      # Entra App Registration client ID for Microsoft Graph
  image:
    repository: acragentwardendev.azurecr.io/agent-warden-saas-proxy
    tag: "latest"
    pullPolicy: IfNotPresent
  # Path-level allow/deny policies per SaaS provider
  policies:
    google:
      allow: []                                # Empty = allow all
      deny:
        - "/gmail/v1/users/me/messages/send"   # Block sending email by default
    graph:
      allow: []
      deny:
        - "/v1.0/me/sendMail"                  # Block sending email by default
    sfdc:
      allow: []
      deny: []
    slack:
      allow: []
      deny: []
    github:
      allow: []
      deny: []


